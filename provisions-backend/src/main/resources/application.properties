spring.application.name=provisions-backend

spring.datasource.url=jdbc:mysql://awseb-e-dwgvpk3ewt-stack-awsebrdsdatabase-kcsnmtkvdadt.cnkas86kecus.us-east-2.rds.amazonaws.com/recipeforge?serverTimezone=America/Chicago
spring.datasource.username=${AWS_DB_USERNAME}
spring.datasource.password=${AWS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.client.registration.cognito.provider=cognito
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.scope[0]=openid
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.cognito.issuer-uri=${COGNITO_ISSUER_URI}

logging.level.org.springframework.security=DEBUG
