spring.application.name=provisions-backend

# Database Configuration (Ensure this is on ONE continuous line)
spring.datasource.url=jdbc:mysql://amazonaws.com
spring.datasource.username=${AWS_DB_USERNAME}
spring.datasource.password=${AWS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Keep this line active to bypass AWS network metadata check
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cognito Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# Logging
logging.level.org.springframework.security=DEBUG
